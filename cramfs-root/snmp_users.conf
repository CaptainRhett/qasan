
####
# First, map the community name (COMMUNITY) into a security name
# (local and mynetwork, depending on where the request is coming
# from):

#       sec.name  source          community
com2sec readonly  default         inspur@0531 
com2sec readonly  default         cmccread
com2sec readwrite  default        cmccwrite

####
# Second, map the security names into group names:

#             	sec.model  sec.name
group MyROSystem usm       paranoid
#group MyROGroup  v1         readonly
#group MyROGroup  v2c        readonly
group MyROGroup usm        readonly
group MyRWGroup usm        readwrite

####
# Third, create a view for us to let the groups have rights to:

#           incl/excl subtree                          mask
view all    included  .1                               80
view system included  .1.3.6.1.2.1.1
view snmpv1v2 excluded .1.3.6.1.4.37945.2.2.1.1.5.1
#view system included  .iso.org.dod.internet.mgmt.mib-2.system

####
# Finally, grant the 2 groups access to the 1 view with different
# write permissions:

#                context sec.model sec.level match  read   write  notif
access MyROSystem ""     any       noauth    exact  system none   none
access MyROGroup ""      any       noauth    exact  all    none   none
access MyRWGroup ""      any       noauth    exact  all    all    none

dlmod libsnmp_hostname_mib /usr/local/lib/libsnmp_hostname_mib.so
dlmod libsnmp_CHANGEME_mib /usr/local/lib/libsnmp_CHANGEME_mib.so
