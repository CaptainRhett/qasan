#Debug Level(0-No Debug, 1-Level 1,2-Level 2)
DEBUGLEVEL=0
#Write option on startup (0-Append to existing debug file, 1-create new file)
OVERWRITE=1
#Directory where debug file will be created
DEBUGDIR=/tmp
#Flag to turn Simulation Mode (0-No Simulation, 1- Simulation Mode (Requires simlib.dll))
SIMULATION=0
OOB=1
OOBMAXREADSIZE=32
OOBMAXWRITESIZE=32
OOBMAXREADWRITESIZEx=36
OOBPOLLINTERVAL=5
OOB_DRIVER_NAME=/dev/i2c7

