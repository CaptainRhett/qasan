server.modules              = ("mod_fastcgi", "mod_setenv", "mod_access", "mod_evasive")
server.upload-dirs = ( "/usr/local/lmedia/lost+found", "/tmp" )

include "mod_websocket.conf"

server.document-root        = "/usr/local/www"
server.pid-file = "/var/run/lighttpd.pid"

# files to check for if .../ is requested
index-file.names            = ( "home.html","index.php", "index.html",
                                "index.htm", "default.htm", "index.html.gz","viewer.html")

server.error-handler-404 = "/index.html"

debug.log-request-handling = "disable"
debug.log-state-handling = "disable"
debug.log-request-header="enable"
debug.log-response-header="enable"

server.max-read-idle = 6
server.max-keep-alive-idle = 10
evasive.max-conns-per-ip = 50
fastcgi.debug = 1

fastcgi.server += ("/api" =>
((
  "bin-path"    => "/usr/local/bin/spx_restservice",
  "max-procs"   => 1,
  "socket"    => "/tmp/spx_restservice.socket",
  "check-local" => "disable",
  "allow-x-send-file" => "enable"
)))

fastcgi.server += ("/redfish" =>
((
  "bin-path"    => "/usr/local/bin/spx_restservice",
  "max-procs"   => 1,
  "socket"    => "/tmp/spx_restservice1.socket",
  "check-local" => "disable",
  "allow-x-send-file" => "enable"
)))

#include_shell "[ -f /conf/lighttpd_ext.conf ] && cat /conf/lighttpd_ext.conf || echo -n "
#include "lighttpd_ext.conf"

include "lighttpd_secure.conf"
#use always https feature based support
include "mod_always_https.conf"
# mimetype mapping
mimetype.assign             = (
  ".gif"          =>      "image/gif",
  ".jpg"          =>      "image/jpeg",
  ".jpeg"         =>      "image/jpeg",
  ".png"          =>      "image/png",
  ".css"          =>      "text/css",
  ".html"         =>      "text/html",
  ".htm"          =>      "text/html",
  ".js"           =>      "text/javascript",
  ".text"         =>      "text/plain",
  ".txt"          =>      "text/plain",
  ".xml"          =>      "text/xml",
  ".elg"          =>      "application/x-ibmclog",
  ".jnlp"         =>      "application/x-java-jnlp-file",
  ".gz"       =>    "application/x-gzip",
  ".tar.gz"   =>    "application/x-gzip-compressed-tar"  
 )

#enable ipv6 support
server.use-ipv6 = "enable"
server.socket = "[::]:80"

## bind to port (default: 80)
server.port = 80

## SSL Engine
$SERVER["socket"] == ":443" {
  ssl.engine = "enable" 
  server.use-ipv6 = "enable"
  ssl.use-sslv2 = "disable"
  ssl.use-sslv3 = "disable"
  ssl.ca-file = "/conf/ca.pem"
  ssl.pemfile = "/conf/server.pem"
  ##ssl.dh-file   = "/conf/dhparam.pem"
  ##ssl.ec-curve  = "secp384r1"
  ssl.cipher-list =  "TLSv1.2 ECDHE !DHE !RSA !SHA !aNULL !eNULL !EXPORT !DES !SSLv2 !3DES !RC4 !MD5 !PSK"
}

setenv.add-response-header += ( "X-Content-Type-Options" => "nosniff",
				"Strict-Transport-Security" => "max-age=31536000; includeSubDomains",
				"X-XSS-Protection" => "1; mode=block",
				"Content-Security-Policy" => "frame-ancestors 'self'; default-src 'none'; child-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' wss://*:*; img-src 'self' data:; frame-src 'self'; font-src 'self'; object-src 'self'; style-src 'self' 'unsafe-inline'",
				"X-Frame-Options" => "SAMEORIGIN", 
				"Referrer-Policy" => "no-referrer",
				"X-Permitted-Cross-Domain-Policies" => "master-only", 
				"X-Download-Options" => "noopen" )

$HTTP["url"] =~ "\.js$|\.html$|\.css$|\.png$|\.woff$|\.jpg$|^/$" {
setenv.add-response-header += ( "Content-Encoding" => "gzip")
}


##set cache control to no only for url with /api/
$HTTP["url"] =~ "^/api" {
setenv.add-response-header += ( "Cache-Control" => "no-store, no-cache, must-revalidate, post-check=0, pre-check=0" )
}

##set cache control to no only for url with .jnlp
$HTTP["url"] =~ "\.jnlp$" {
setenv.add-response-header += ( "Cache-Control" => "no-store, no-cache, must-revalidate, post-check=0, pre-check=0" )
}

##set no access for security directory
$HTTP["url"] =~ "^/certs/" {
        url.access-deny = ("")
}

##disable HEAD and OPTIONS methods
$HTTP["request-method"] =~ "^(HEAD|OPTIONS)$" {
        url.access-deny = ("")
}


include "redfish_lighttpd.conf"
